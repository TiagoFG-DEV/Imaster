<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>IMaster — Carregar Jogo</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=55">
  <style>
.load-page { min-height: 100vh; background: var(--bg); overflow-y: auto; }
.load-container { position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:40px 24px 100px; }
.load-header { text-align:center; margin-bottom:40px; }
.load-back-btn { display:inline-flex; align-items:center; gap:8px; color:var(--text-d); font-family:var(--font-t); font-size:12px; letter-spacing:2px; text-transform:uppercase; background:none; border:none; cursor:pointer; text-decoration:none; transition:color var(--trans); margin-bottom:28px; }
.load-back-btn:hover { color:var(--gold); }
.load-sigil { font-size:52px; color:var(--gold); line-height:1; filter:drop-shadow(0 0 28px rgba(201,168,76,.55)); animation:runeFloat 5s ease-in-out infinite; display:block; margin-bottom:12px; }
@keyframes runeFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
.load-title { font-family:var(--font-d); font-size:clamp(28px,5vw,44px); color:var(--gold); letter-spacing:5px; text-transform:uppercase; margin:0 0 8px; }
.load-sub { font-size:14.5px; color:var(--text-d); letter-spacing:.5px; }
.sessions-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; }
@media (max-width:720px) { .sessions-grid { grid-template-columns:1fr; } }
.session-loading { grid-column:1 / -1; text-align:center; color:var(--text-d); padding:60px; font-style:italic; }
.no-sessions { grid-column:1 / -1; text-align:center; color:var(--text-d); padding:60px; font-size:16px; }
.no-sessions a { color:var(--gold); }
.confirm-overlay { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,.85); backdrop-filter:blur(10px); display:none; align-items:center; justify-content:center; }
.confirm-overlay.active { display:flex; }
.confirm-modal { background:linear-gradient(145deg,rgba(20,16,30,.98),rgba(12,10,20,.99)); border:1.5px solid rgba(192,48,48,.45); border-radius:18px; padding:40px 36px; max-width:420px; width:90%; text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 60px rgba(192,48,48,.15); animation:slideUpIn .3s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes slideUpIn { from{transform:translateY(30px) scale(.95);opacity:0} to{transform:none;opacity:1} }
.confirm-icon { font-size:48px; }
.confirm-title { font-family:var(--font-t); font-size:18px; color:var(--red3); letter-spacing:2px; text-transform:uppercase; }
.confirm-text { font-size:14px; color:var(--text2); line-height:1.6; }
.confirm-actions { display:flex; gap:12px; margin-top:8px; }
.confirm-btn-cancel { padding:10px 24px; background:var(--surf2); border:1px solid var(--border); border-radius:var(--r); color:var(--text-d); font-family:var(--font-t); font-size:12px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
.confirm-btn-cancel:hover { border-color:var(--gold); color:var(--gold); }
.confirm-btn-delete { padding:10px 24px; background:var(--red2); border:1px solid var(--red3); border-radius:var(--r); color:#fff; font-family:var(--font-t); font-size:12px; letter-spacing:2px; text-transform:uppercase; cursor:pointer; transition:all .2s; }
.confirm-btn-delete:hover { background:#c03030; box-shadow:0 0 20px rgba(192,48,48,.5); }
  </style>
</head>
<body class="load-page">
  <div class="menu-bg"><canvas id="bg-canvas"></canvas><div class="menu-overlay"></div></div>
  <div class="load-container">
    <a href="index.html" class="load-back-btn">&#x27F5; Voltar ao Inicio</a>
    <div class="load-header">
      <span class="load-sigil">&#x2E38;</span>
      <h1 class="load-title">Carregar Jogo</h1>
      <p class="load-sub">Escolha uma sessao para continuar sua investigacao</p>
    </div>
    <div id="sessions-grid" class="sessions-grid">
      <div class="session-loading">Carregando sessões...</div>
    </div>
    <p id="no-sessions" class="no-sessions" style="display:none">
      Nenhuma sessao encontrada. <a href="mode.html">Inicie uma nova historia.</a>
    </p>
  </div>
  <script src="js/load.js?v=55"></script>
</body>
</html>
